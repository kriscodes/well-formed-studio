# Prepared for review only. Importing this Blueprint creates and deploys resources.
# yaml-language-server: $schema=https://render.com/schema/render.yaml.json
previews:
  generation: 'off'
projects:
  - name: Well Formed Studio Staging
    environments:
      - name: staging
        services:
          - type: web
            name: well-formed-studio-staging
            runtime: static
            buildCommand: npm ci && npm run build
            staticPublishPath: ./dist
            autoDeployTrigger: checksPass
            envVars:
              - key: SKIP_INSTALL_DEPS
                value: 'true'
              - key: NODE_VERSION
                value: 22.23.4
            headers:
              - path: /*
                name: X-Content-Type-Options
                value: nosniff
              - path: /*
                name: Referrer-Policy
                value: strict-origin-when-cross-origin
              - path: /*
                name: X-Frame-Options
                value: DENY
              - path: /*
                name: Permissions-Policy
                value: camera=(), microphone=(), geolocation=()
              - path: /*
                name: Content-Security-Policy
                value: >-
                  default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self';
                  connect-src 'none'; frame-src 'none'; frame-ancestors 'none'; base-uri 'none'; form-action 'none';
                  object-src 'none'; upgrade-insecure-requests
              - path: /*
                name: X-Robots-Tag
                value: noindex, nofollow, noarchive
            repo: https://github.com/kriscodes/well-formed-studio
            branch: staging
            domains:
              - staging.wellformedstudio.com
            buildFilter:
              paths:
                - src/**
                - public/**
                - scripts/**
                - index.html
                - package.json
                - package-lock.json
                - tsconfig*.json
                - .nvmrc
                - render.staging.yaml
